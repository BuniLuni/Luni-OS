name: Notify Discord of site updates

on:
  push:
    branches: [main]          # change to master if that's your branch
    paths-ignore:
      - ".github/**"         # don't announce edits to these workflows

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post commits to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python3 .github/scripts/notify_commits.py
