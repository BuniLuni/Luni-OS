 const los=(a,c,x,y)=>{const dx=Math.abs(x-a),dy=Math.abs(y-c),sx=a<x?1:-1,sy=c<y?1:-1;let er=dx-dy;while(!(a===x&&c===y)){const e2=2*er;if(e2>-dy){er-=dy;a+=sx}if(e2<dx){er+=dx;c+=sy}if(a===x&&c===y)break;if(S.m[c][a]===0)return false}return true};
 function fov(){const p=S.p;for(const r of S.vis)r.fill(false);for(let y=Math.max(0,p.y-8);y<=Math.min(H-1,p.y+8);y++)for(let x=Math.max(0,p.x-8);x<=Math.min(W-1,p.x+8);x++){if((x-p.x)**2+(y-p.y)**2>70)continue;if(los(p.x,p.y,x,y)){S.vis[y][x]=true;S.seen[y][x]=true}}}
 function flood(){const dm=Array.from({length:H},()=>Array(W).fill(999)),q=[[S.p.x,S.p.y]];dm[S.p.y][S.p.x]=0;for(let i=0;i<q.length;i++){const[x,y]=q[i];for(const[a,c]of D4){const nx=x+a,ny=y+c;if(S.m[ny]?.[nx]>0&&dm[ny][nx]===999){dm[ny][nx]=dm[y][x]+1;q.push([nx,ny])}}}return dm}

 /* ---------- generation ---------- */
 function mk(df,x,y,boss){const d=S.d,el=!boss&&d>=3&&Math.random()<.12,bs=boss?1+.25*(d/5-1):1+.2*(d-1),ba=boss?1+.15*(d/5-1):1+.12*(d-1),hp=Math.round(df[2]*bs*(el?1.6:1));
  return{n:(el?'Elite ':'')+df[0],g:df[1],hp,mhp:hp,atk:Math.round(df[3]*ba*(el?1.3:1)),ai:boss?df[4]:df[5],xp:Math.round((boss?df[2]*.5:df[6])*(el?2:1)*(1+.1*(d-1))),x,y,el,boss:!!boss,al:false,t:0}}
 function mkItem(x,y){const r=Math.random()*100,d=S.d;
  if(r<34)return{x,y,k:'pot'};if(r<46)return{x,y,k:'tele'};if(r<60)return{x,y,k:'fire'};
  if(r<76)return{x,y,k:'wpn',v:1+(d>>1)+ri(0,2),n:pick(WP)+' '+pick(WN)};
  if(r<92)return{x,y,k:'arm',v:1+(d>>2)+ri(0,1),n:pick(AP)+' '+pick(AN)};
  return{x,y,k:'chm'}}
 function gen(){
  const d=S.d,m=Array.from({length:H},()=>Array(W).fill(0)),rooms=[];
  for(let i=0;i<90&&rooms.length<10;i++){const rw=ri(4,9),rh=ri(3,6),x=ri(1,W-rw-2),y=ri(1,H-rh-2);
   if(rooms.some(r=>x<r.x+r.w+2&&x+rw+2>r.x&&y<r.y+r.h+2&&y+rh+2>r.y))continue;rooms.push({x,y,w:rw,h:rh});
   for(let a=y;a<y+rh;a++)for(let c=x;c<x+rw;c++)m[a][c]=1}
  if(rooms.length<5)return gen();
  const ctr=r=>[r.x+(r.w>>1),r.y+(r.h>>1)];
  for(let i=1;i<rooms.length;i++){let[a,c]=ctr(rooms[i-1]);const[e,f]=ctr(rooms[i]);while(a!==e){m[c][a]=1;a+=Math.sign(e-a)}while(c!==f){m[c][a]=1;c+=Math.sign(f-c)}m[c][a]=1}
  S.m=m;S.seen=Array.from({length:H},()=>Array(W).fill(false));S.vis=Array.from({length:H},()=>Array(W).fill(false));S.mons=[];S.items=[];S.shop=null;
  const f0=ctr(rooms[0]),f1=ctr(rooms[rooms.length-1]);S.p.x=f0[0];S.p.y=f0[1];m[f1[1]][f1[0]]=2;
  const free=r=>{for(let i=0;i<40;i++){const x=ri(r.x,r.x+r.w-1),y=ri(r.y,r.y+r.h-1);if(m[y][x]===1&&!occ(x,y))return[x,y]}return null};
  const lastR=rooms[rooms.length-1];
  rooms.forEach((r,i)=>{if(i===0)return;let n=ri(0,2)+(d>4?1:0)+(d>9?1:0);if(i===rooms.length-1&&d%5===0)n=0;
   for(;n>0;n--){const s=free(r);if(!s)continue;const pool=EN.filter(e=>e[4]<=d).slice(-5);S.mons.push(mk(pick(pool),s[0],s[1]))}});
  if(d%5===0){const s=free(lastR);if(s){const bm=mk(BOSS[(d/5-1)%3],s[0],s[1],true);S.mons.push(bm)}}
  for(let n=ri(3,5)+meta.up.luck;n>0;n--){const s=free(pick(rooms));if(s)S.items.push(mkItem(s[0],s[1]))}
  for(let n=ri(2,4);n>0;n--){const s=free(pick(rooms));if(s)S.items.push({x:s[0],y:s[1],k:'gold',v:Math.round(ri(5,12)*(1+.3*d))})}
  if(d%3===0){const s=free(rooms[ri(1,rooms.length-2)]);if(s)S.shop={x:s[0],y:s[1]}}}
 function descend(){const p=S.p;S.d++;gen();p.hp=Math.min(p.mhp,p.hp+Math.ceil(p.mhp*.1));p.pois=0;if(S.d>meta.best){meta.best=S.d;save()}
  say('--- Floor '+S.d+(S.d%5===0?': a boss lurks here!':'')+(S.shop?' You hear a merchant\'s bell.':''));fov();draw();upd()}
 function newRun(k){const c=CL[k],mh=c.hp+5*meta.up.hp;

 /* ---------- combat ---------- */
 function dmgE(e,n){if(e.hp<=0)return;e.hp-=n;e.al=true;if(e.hp<=0)kill(e)}
 function hit(e,base,noc){const p=S.p;let dm=Math.max(1,base+ri(-1,2));const c=!noc&&(p.nc||Math.random()*100<p.crit);if(c){dm*=2;p.nc=0}
  say((c?'Critical! ':'')+'You hit the '+e.n+' for '+dm+'.');if(p.vamp)p.hp=Math.min(p.mhp,p.hp+p.vamp);dmgE(e,dm)}
 function kill(e){S.mons=S.mons.filter(z=>z!==e);const p=S.p;S.kills++;meta.kills++;say((e.boss?'*** ':'')+'The '+e.n+' dies.');p.xp+=e.xp;
  const g=Math.round((ri(1,4)+(e.el?8:0)+(e.boss?60:0))*(1+.3*S.d)*p.gm*((e.boss||e.el||Math.random()<.5)?1:0));if(g){p.gold+=g;say('+'+g+' gold.')}
  if(e.ai==='split'&&e.mhp>=6)for(let i=0;i<2;i++){const s=adj(e.x,e.y);if(s){const k=mk(EN[2],s[0],s[1]);k.n='Slimeling';k.hp=k.mhp=Math.ceil(e.mhp/2);k.xp=2;k.ai='melee';k.al=true;S.mons.push(k)}}
  if(e.el||e.boss){S.items.push(mkItem(e.x,e.y));if(e.boss){const s=adj(e.x,e.y);if(s)S.items.push({x:s[0],y:s[1],k:'pot'})}}
  while(p.xp>=need(p.lvl)){p.xp-=need(p.lvl);p.lvl++;S.lq++;say('LEVEL UP! You are level '+p.lvl+'.')}}
 function hurtP(n,src,pierce){const p=S.p,dm=pierce?n:Math.max(1,n-def());p.hp-=dm;say((src?src.n:'Something')+' hits you for '+dm+'.');
  if(src&&p.thorns&&Math.abs(src.x-p.x)+Math.abs(src.y-p.y)===1){say('Thorns hurt the '+src.n+'.');dmgE(src,p.thorns*2)}
  if(p.hp<=0)die(src?src.n:'wounds')}
 function act(e,dd,see,dm){const p=S.p,ai=e.ai;
  const nbs=()=>D4.map(([a,c])=>[e.x+a,e.y+c]).filter(([a,c])=>S.m[c][a]!==0&&!mAt(a,c)&&!(a===p.x&&c===p.y)&&!isShop(a,c));
  const go2=q=>{if(q){e.x=q[0];e.y=q[1]}},chase=()=>go2(nbs().filter(([a,c])=>dm[c][a]<dd).sort((u,v)=>dm[u[1]][u[0]]-dm[v[1]][v[0]])[0]),
   flee=()=>{const o=nbs().filter(([a,c])=>dm[c][a]>dd);go2(o.length?pick(o):null)},rand=()=>{const o=nbs();go2(o.length?pick(o):null)};
  if(ai==='ranged'){if(dd<=2&&Math.random()<.5)return flee();if(see&&dd<=7){say(e.n+' shoots at you!');return hurtP(e.atk,e)}return chase()}
  if(ai==='erratic'&&Math.random()<.4)return rand();
  if(ai==='summon'&&see&&e.t%4===0&&S.mons.length<18){const s=adj(e.x,e.y);if(s){const k=mk(EN[3],s[0],s[1]);k.al=true;S.mons.push(k);return say('The '+e.n+' summons a goblin!')}}
  if(ai==='lich'){if(see&&e.t%5===0&&S.mons.length<18){const s=adj(e.x,e.y);if(s){const k=mk(EN[5],s[0],s[1]);k.al=true;S.mons.push(k);return say('The Lich raises a skeleton!')}}
   if(see&&dd>=2&&e.t%2===0){say('The Lich hurls a dark bolt!');return hurtP(Math.round(e.atk*1.2),e)}
   if(e.hp<e.mhp/2&&e.t%7===0){for(let i=0;i<30;i++){const x=p.x+ri(-6,6),y=p.y+ri(-6,6);if(S.m[y]?.[x]===1&&!occ(x,y)){e.x=x;e.y=y;return say('The Lich vanishes and reappears!')}}}}
  if(ai==='breath'&&see&&(e.x===p.x||e.y===p.y)&&dd<=8&&e.t%5===0){say('The dragon breathes fire!');return hurtP(Math.round(e.atk*1.6),e)}
  if(dd===1){hurtP(e.atk,e);if(ai==='poison'&&!S.dead){p.pois=Math.min(8,p.pois+3);say('You are poisoned!')}return}
  chase()}
 function endTurn(){const p=S.p;S.turn++;
  if(p.pois>0){p.pois--;p.hp--;if(p.hp<=0)return die('poison')}
  if(S.turn%p.reg===0&&p.hp<p.mhp)p.hp++;
  if(p.cd>0)p.cd--;
  const dm=flood();
  for(const e of S.mons.slice()){if(e.hp<=0||S.dead)continue;e.t++;const dd=dm[e.y][e.x],see=dd<=9&&los(e.x,e.y,p.x,p.y);if(see)e.al=true;if(e.al)act(e,dd,see,dm)}
  if(S.dead)return;fov();draw();upd();if(S.lq>0)perkView()}
 function die(by){if(S.dead)return;S.dead=true;const sl=S.d*4+S.kills+S.p.lvl*2;meta.souls+=sl;meta.best=Math.max(meta.best,S.d);save();draw();upd();
  menu('☠ Slain by '+by+' on floor '+S.d+' (level '+S.p.lvl+', '+S.kills+' kills). You gained '+sl+' souls.')}

 function pickup(){const p=S.p,i=S.items.findIndex(t=>t.x===p.x&&t.y===p.y);if(i<0)return;const t=S.items.splice(i,1)[0];
  if(t.k==='pot'){p.pot++;say('Found a healing potion.')}else if(t.k==='tele'){p.tele++;say('Found a scroll of teleport.')}else if(t.k==='fire'){p.fire++;say('Found a scroll of fireball.')}
  else if(t.k==='gold'){const g=Math.round(t.v*p.gm);p.gold+=g;say('+'+g+' gold.')}else if(t.k==='chm'){p.mhp+=6;p.hp+=6;say('A charm hums: +6 max HP.')}
  else if(t.k==='wpn'){if(t.v>p.wv){p.wv=t.v;p.wn=t.n;say('Equipped '+t.n+' (+'+t.v+' attack).')}else{const g=t.v*4;p.gold+=g;say('Sold the weak '+t.n+' for '+g+' gold.')}}
  else{if(t.v>p.av){p.av=t.v;p.an=t.n;say('Equipped '+t.n+' (+'+t.v+' defense).')}else{const g=t.v*4;p.gold+=g;say('Sold the weak '+t.n+' for '+g+' gold.')}}}
 function go(dx,dy){if(!ready())return;const p=S.p;p.dir=[dx,dy];const nx=p.x+dx,ny=p.y+dy;if(S.m[ny]?.[nx]===undefined)return;
  const e=mAt(nx,ny);if(e){hit(e,atk());return endTurn()}
  if(isShop(nx,ny))return shopView();
  if(S.m[ny][nx]===0)return;
  p.x=nx;p.y=ny;pickup();if(S.m[ny][nx]===2){say('You descend the stairs...');return descend()}
  endTurn()}
 function ability(){if(!ready())return;const p=S.p,c=CL[S.k];if(p.cd>0)return say(c.ab+' is recharging ('+p.cd+' turns).');
  if(S.k==='warrior'){const t=S.mons.filter(e=>Math.max(Math.abs(e.x-p.x),Math.abs(e.y-p.y))<=1);if(!t.length)return say('No enemies close enough.');say('Whirlwind!');t.forEach(e=>hit(e,atk()*2,true))}
  else if(S.k==='rogue'){let n=0;for(let i=0;i<4;i++){const x=p.x+p.dir[0],y=p.y+p.dir[1];if(S.m[y]?.[x]===1&&!mAt(x,y)&&!isShop(x,y)){p.x=x;p.y=y;n++;pickup()}else break}
   if(!n)return say('Something blocks your dash.');p.nc=1;say('Shadowstep! Your next strike will crit.')}
  else{const t=S.mons.filter(e=>S.vis[e.y][e.x]).sort((a,c2)=>Math.abs(a.x-p.x)+Math.abs(a.y-p.y)-Math.abs(c2.x-p.x)-Math.abs(c2.y-p.y))[0];if(!t)return say('No enemy in sight.');
   const dm=atk()*2+4+p.lvl;say('Firebolt hits the '+t.n+' for '+dm+'!');dmgE(t,dm)}

 function useItem(k){if(!ready())return;const p=S.p;

 function draw(){if(!S||!S.m)return;const p=S.p,ox=Math.min(W-VW,Math.max(0,p.x-(VW>>1))),oy=Math.min(H-VH,Math.max(0,p.y-(VH>>1)));

 return c}
function fit(p,W,H,sc){const cw=Math.max(1,W*sc|0),ch=Math.max(1,H*sc|0);

  p.cv=document.createElement('canvas');p.cv.width=cw;p.cv.height=ch;p.cx=p.cv.getContext('2d');if(p.tex)p.tex.dispose();
  p.tex=new THREE.CanvasTexture(p.cv);p.tex.encoding=THREE.sRGBEncoding;p.tex.minFilter=THREE.LinearFilter;p.tex.generateMipmaps=false;p.tex.anisotropy=rd.capabilities.getMaxAnisotropy();p.mesh.material.map=p.tex;p.mesh.material.needsUpdate=true}

 const first=!p.base;fit(p,W,H,sc);p.bc.clearRect(0,0,p.cw,p.ch);p.bc.drawImage(im,0,0,p.cw,p.ch);

function place(p){if(!home||!p.mesh)return;const k=p.kind,m=p.mesh;let yaw=home.yaw,d=+V.dist,y=home.y-.05,tilt=0;

 [['menu',e=>e.classList.contains('on')],['ctx',e=>e.classList.contains('on')],['toast',e=>e.style.display==='block'],['ann',e=>e.style.display&&e.style.display!=='none']].forEach(([k,f])=>{const e=$('#'+k);if(e&&f(e))w.push([k,e,k])});

 home={x:p.x,z:p.z,y:p.y>.5?p.y:1.5,yaw:Math.atan2(-f.x,-f.z)};P.forEach(place);if(kb.on)kbPlace()}

function ray(c){TM.identity().extractRotation(c.matrixWorld);RC.ray.origin.setFromMatrixPosition(c.matrixWorld);RC.ray.direction.set(0,0,-1).applyMatrix4(TM)}

const edit=a=>!!a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|color|range|image|reset)$/.test(a.type)))&&!a.readOnly&&!a.disabled;

  const a=t.closest('a[href]');if(a&&a.target==='_blank'){toast('Links open in a new tab - not available in VR');return}

/* ---------- VR keyboard ---------- */

 clr();const e=V.env,L=+V.light,AB=THREE.AdditiveBlending,rnd=Math.random;

  const N=9000,gp=new Float32Array(N*3),gc=new Float32Array(N*3),col=new THREE.Color();

  const gh=new THREE.Group();gh.position.set(-10,28,-85);gh.rotation.set(.45,0,.25);gh.add(new THREE.Points(g,new THREE.PointsMaterial({size:2,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.85,blending:AB,depthWrite:false})));envG.add(gh);spin=gh;
  add2(new THREE.SphereGeometry(9,40,28),St(0x3a6ea5),-32,-6,-48);add2(new THREE.SphereGeometry(2.6,24,18),St(0xc2603a),26,10,-34);

 add2(new THREE.BoxGeometry(2.4,.5,.9),St(0x6a1020),0,.25,3.6);add2(new THREE.BoxGeometry(2.4,.6,.2),St(0x6a1020),0,.7,4.0);

 if(!home&&fr>3)recenter();
 if(envKey!==V.env+V.light){envKey=V.env+V.light;env()}
 if(layKey!==V.size+V.dist){layKey=V.size+V.dist;P.forEach(p=>{place(p);p.dirty=true})}

 if(cx){cx.mesh.visible=uiOn&&!!cx.cx&&!!ctxA;if(ctxA){const s=cx.kk;cx.mesh.position.copy(ctxA.pt).add(new THREE.Vector3(cx.W/2*s,-cx.H/2*s,.03).applyQuaternion(ctxA.q));cx.mesh.quaternion.copy(ctxA.q)}}

 for(const c of ctrls){const it=pick(c),u=c.userData;u.h=it;u.line.scale.z=it?it.d:2.5;if(it&&it.p===kb){const r=kbAt(it.x,it.y);if(r)kh=r.id}}

 for(const c of ctrls){const u=c.userData,g=u.src&&u.src.gamepad;if(!g)continue;const b=g.buttons,bt=i=>!!(b[i]&&b[i].pressed),ay=g.axes[3]||0;
  if(bt(3)&&!u.b3)recenter();u.b3=bt(3);
  if(bt(4)&&!u.b4){uiOn=!uiOn;toast(uiOn?'Windows shown':'Windows hidden (A/X to show)')}u.b4=bt(4);

  if(Math.abs(ay)>.15){if(grab&&grab.c===c)grab.d=Math.max(.5,Math.min(6,grab.d+ay*.03));else if(u.h&&u.h.p!==kb)scrollAt(u.h,ay*20)}}

 if(st.banned){toast('🚫 You have been banned.');quit()}const _k=st.role+'|'+!!st.cpower;if(S&&S._k!==_k){S._k=_k;if(typeof refreshIcons==='function')refreshIcons()}}
async function push(){if(!S||!S.online||pb)return;pb=1;try{const c0=S.cash,n0=S.coin,{data,error}=await sb.rpc('mine_sync',{p_dcash:c0-OL.lc,p_dcoin:n0-OL.ln,p_save:slim(),p_hash:stats().hash,p_level:S.lvl,p_nw:nw(S)});if(error)toast('⚠️ Sync: '+error.message);else{ap(data,c0,n0);econ()}}finally{pb=0}}
async function call(fn,args,fl=1){if(fl)await push();const c0=S.cash,n0=S.coin,{data,error}=await sb.rpc(fn,args);if(error){toast('⚠️ '+error.message);return null}if(data&&data.cash!==undefined)ap(data,c0,n0);upd();return data??true}
async function goOnline(){toast('🌐 Connecting…');try{await goOnline2()}catch(e){dlg({m:'Online error: '+(e&&e.message||e),nc:1})}}
async function goOnline2(){
 if(!sb||SB_URL.includes('YOUR-'))return dlg({m:'Online mode is not configured yet.\nPut your Supabase URL and anon key at the top of the online script.',nc:1});
 const{data:{session}}=await sb.auth.getSession();
 if(!session){
  if(BR){toast('Log in with GitHub first');return BR.login()}
  if(top!==self)return dlg({m:'This page is running inside a preview frame, so GitHub login cannot work here.\nOpen the file from your real site (the https:// GitHub Pages address) in its own tab.',nc:1});
  if(location.protocol==='file:')return dlg({m:'GitHub login does not work from a local file.\nUpload the page to your site (https://) and open it there.',nc:1});
  try{sessionStorage.mpgo=1}catch(e){}
  const{data:o,error:oe}=await sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.href.split('#')[0].split('?')[0],skipBrowserRedirect:true}});
  if(oe)return dlg({m:'Login error: '+oe.message,nc:1});
  toast('➡️ Redirecting to GitHub…');return location.assign(o.url)}
 const{data:st,error}=await sb.rpc('mine_ensure');if(error)return dlg({m:'Online error: '+error.message,nc:1});
 if(st.banned)return dlg({m:'🚫 This account is banned.',nc:1});
 const{data:sv}=await sb.from('mine_saves').select('data').eq('id',session.user.id).maybeSingle();
 const s=norm({...(sv&&sv.data||{}),id:'__online',name:st.name,created:Date.now()});
 Object.assign(s,{online:1,cx:{},last:Date.now(),cash:st.cash,coin:st.coin,price:st.price,hist:[st.price]});saves.__online=s;
 OL.lc=st.cash;OL.ln=st.coin;OL.msgs=[];
 start('__online',!sv);ap(st,st.cash,st.coin);
 OL.t=setInterval(push,5000);
 const{data:ms}=await sb.from('mine_messages').select('*').order('id',{ascending:false}).limit(30);OL.msgs=(ms||[]).reverse();
 OL.ch=sb.channel('mp').on('postgres_changes',{event:'INSERT',schema:'public',table:'mine_messages'},p=>chatAdd(p.new))
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'mine_transfers',filter:'to_id=eq.'+session.user.id},p=>toast('💸 You received '+(p.new.asset=='cash'?m(p.new.amount):p.new.amount+' LNC')+'!')).subscribe();
 toast('🌐 Online as '+st.name+(st.role=='owner'?' 👑':''));if(st.motd)setTimeout(()=>toast('📢 '+st.motd),1500)}
function oquit(){push();clearInterval(OL.t);if(OL.ch)sb.removeChannel(OL.ch);OL.ch=null;delete saves.__online}
addEventListener('unhandledrejection',e=>toast('⚠️ '+(e.reason&&e.reason.message||e.reason)));
if(sb)sb.auth.getSession().then(r=>{if(r.data.session&&sessionStorage.mpgo){delete sessionStorage.mpgo;goOnline()}});
async function otrade(k){const q=+$('#tq').value;if(!(q>0))return toast('Enter a quantity.');if(await call('mine_trade',{p_side:k,p_qty:q}))S.trades++}
function chatAdd(r){OL.msgs.push(r);if(OL.msgs.length>80)OL.msgs.shift();chatDraw();if(r.kind==='sys'&&!W.chat)toast('📢 '+r.body)}
function chatDraw(){const l=$('#chl');if(!l)return;l.innerHTML=OL.msgs.map(r=>r.kind==='sys'?`<div style="color:#800"><b>📢 ${esc(r.body)}</b></div>`:`<div>${r.company_id?'🏢 ':''}<b>${esc(r.username)}</b>: ${esc(r.body)}</div>`).join('');l.scrollTop=1e9}
async function chatSend(){const i=$('#cht'),b=i.value.trim();if(!b)return;i.value='';await call('mine_post',{p_body:b,p_co:$('#chc').checked},0)}
async function osend(){const u=$('#su').value.trim(),a=+$('#sa').value,k=$('#sk').value;if(!u||!(a>0))return toast('Enter a player and amount.');if(await call('mine_send',{p_to:u,p_asset:k,p_amt:a}))toast('💸 Sent '+(k=='cash'?m(a):a+' LNC')+' to '+u)}
async function rNet(){const el=$('#nethub');if(!el)return;const[{data:p},{data:c},{count}]=await Promise.all([sb.from('mine_players').select('username,nw').order('nw',{ascending:false}).limit(15),sb.from('mine_companies').select('name,tag,treasury').order('treasury',{ascending:false}).limit(8),sb.from('mine_players').select('id',{count:'exact',head:true}).gt('last_seen',new Date(Date.now()-3e4).toISOString())]);
 el.innerHTML=`<div class="panel">🟢 <b>${count}</b> online · transfer fee ${(S.fee*100).toFixed(1)}%</div><fieldset><legend>🏆 Richest players</legend>${(p||[]).map((x,i)=>`<div class="row">${i+1}. <b>${esc(x.username)}</b><span style="margin-left:auto">${m(x.nw)}</span></div>`).join('')}</fieldset><fieldset><legend>🏢 Top companies</legend>${(c||[]).map(x=>`<div class="row">[${esc(x.tag)}] ${esc(x.name)}<span style="margin-left:auto">${m(x.treasury)}</span></div>`).join('')||'None yet'}</fieldset>`}
async function rCo(){const el=$('#cobox');if(!el)return;const c=S.co;
 if(!c){const{data}=await sb.from('mine_companies').select('name,tag,treasury').order('treasury',{ascending:false}).limit(15);el.innerHTML=`<fieldset><legend>Found a company ($10,000)</legend><div class="row"><input id="cn" class="f" placeholder="Name"><input id="ct" style="width:60px" placeholder="TAG" maxlength="4"></div><button class="big" onclick="coNew()">Create</button></fieldset><fieldset><legend>Join one</legend>${(data||[]).map(x=>`<div class="item"><div><b>[${esc(x.tag)}] ${esc(x.name)}</b><small>${m(x.treasury)}</small></div><button data-n="${esc(x.name)}" onclick="coDo('mine_co_join',{p_name:this.dataset.n})">Join</button></div>`).join('')||'No companies yet.'}</fieldset>`;return}
 const{data:mb}=await sb.from('mine_players').select('username,co_role').eq('company_id',c.id);
 el.innerHTML=`<div class="panel"><b>[${esc(c.tag)}] ${esc(c.name)}</b><br>Treasury <b>${m(c.treasury)}</b> · ${c.members} members<br>Hashrate bonus <b>+${(S.cob*100).toFixed(0)}%</b> (grows with members &amp; treasury)</div><div class="row"><input id="cd" type="number" min="1" value="1000" class="f"><button onclick="coDep(1)">Deposit</button><button onclick="coDep(-1)">Withdraw</button></div><fieldset><legend>Members</legend>${(mb||[]).map(x=>`<div class="row"><b>${esc(x.username)}</b> ${x.co_role}<span style="margin-left:auto">${c.role=='owner'&&x.co_role!='owner'?`<button data-n="${esc(x.username)}" onclick="coDo('mine_co_kick',{p_user:this.dataset.n})">Kick</button>`:''}</span></div>`).join('')}</fieldset><button onclick="coDo('mine_co_leave',{})">🚪 Leave company</button>`}
async function coDo(f,a){if(await call(f,a))rCo()}
const coNew=()=>coDo('mine_co_create',{p_name:$('#cn').value,p_tag:$('#ct').value}),coDep=s=>coDo('mine_co_treasury',{p_amt:s*(+$('#cd').value||0)});
const myN=()=>String(S&&S.name||'').toLowerCase();
function selfReset(){dlg({m:'Reset YOUR online save?\nCash, coins, rigs, upgrades and level are wiped. You stay the owner.'},async y=>{if(!y)return;
 const r=await call('mine_admin',{p_act:'wipe',p:{user:myN(),amt:0,text:'',name:''}},0);if(r===null)return;
 const{data:st,error}=await sb.rpc('mine_ensure');if(error)return toast('⚠️ '+error.message);
 const keep={id:S.id,name:S.name,role:S.role,muted:S.muted,fee:S.fee,news:S.news,motd:S.motd,co:S.co,cob:S.cob};
 for(const k of Object.keys(S))delete S[k];
 Object.assign(S,norm({...keep,created:Date.now()}),{online:1,cx:{},last:Date.now(),cash:st.cash,coin:st.coin,price:st.price,hist:[st.price]});
 OL.lc=st.cash;OL.ln=st.coin;await push();upd();rAdm();toast('♻️ Your save was reset.')})}
async function adm(a,v){const tu=$('#au').value.trim().toLowerCase();
 if(a==='ban'&&v&&tu&&tu===myN())return toast('🚫 You can’t ban yourself.');
 if(a==='wipe'&&tu&&tu===myN())return selfReset();
 const r=await call('mine_admin',{p_act:a,p:{user:$('#au').value.trim().toLowerCase(),amt:+$('#aa').value||0,text:$('#at').value,name:$('#ac').value.trim(),v}},0);if(r==='ok')toast('✅ '+a+' done');rAdm()}
async function rAdm(){const el=$('#adl');if(!el)return;const{data,error}=await sb.rpc('mine_admin_overview');if(error){el.textContent=error.message;return}
 el.innerHTML=data.players.map(x=>`<div class="row" style="cursor:pointer" data-u="${esc(x.username)}" onclick="$('#au').value=this.dataset.u"><b>${esc(x.username)}</b> ${x.role}${x.banned?' 🚫':''}${x.muted?' 🔇':''}${x.flags?` <span style="color:#c00">🚩${x.flags}</span>`:''}<span style="margin-left:auto">${m(x.nw)}</span></div>`).join('')+'<hr>'+data.audit.map(x=>`<small style="display:block">${esc(x.who||'sys')}: ${esc(x.note)}</small>`).join('')}
const AB=(l,a,f)=>`<button onclick="adm('${a}'${f?','+f:''})">${l}</button>`;
Object.assign(APPS,{
net:{t:'Online Hub',e:'🌐',w:340,on:1,init:rNet,h:()=>`<div class="row"><button onclick="rNet()">🔄 Refresh</button></div><div id="nethub">Loading…</div><fieldset><legend>💸 Send money</legend><div class="row"><input id="su" class="f" placeholder="username"></div><div class="row"><input id="sa" type="number" min="0" step="any" value="100" class="f"><select id="sk"><option value="cash">$ Cash</option><option value="coin">LNC</option></select></div><button class="big" onclick="osend()">Send</button></fieldset>`},
co:{t:'Company',e:'🏢',w:340,on:1,init:rCo,h:()=>`<div id="cobox">Loading…</div>`},
chat:{t:'Global Chat',e:'💬',w:340,on:1,init:chatDraw,h:()=>`<div class="panel" id="chl" style="height:210px;overflow:auto;user-select:text"></div><label><input type="checkbox" id="chc"> Company chat only</label><div class="row"><input id="cht" class="f" maxlength="200" onkeydown="if(event.key==='Enter')chatSend()"><button onclick="chatSend()">Send</button></div>`},
mpadmin:{t:'Admin Console (MP)',e:'🛠️',w:400,on:1,own:1,init:()=>{rAdm();cpLncInit()},h:()=>`<div class="panel">👑 Owner only. Every action is verified on the server.</div><div class="row"><button class="f" onclick="openLnc()">💎 Crypto Power</button></div><fieldset id="cpgo" style="display:none"><legend>🔑 Who has Crypto Power (online)</legend><div class="row"><input id="cpgu" class="f" placeholder="player username">${cpB('Grant','cpGrantOn(true)')}${cpB('Revoke','cpGrantOn(false)')}</div><div id="cpgl"><small>Loading…</small></div><small>Only you (the owner) can give or take Crypto Power. Holders can give LNC to players and use price, event and headline actions. Rain, bans and the rest stay owner-only.</small></fieldset><div class="row"><input id="au" class="f" placeholder="player username"><button onclick="$('#au').value=myN()">🧑 Me</button><input id="aa" type="number" value="1000" style="width:90px"></div><fieldset><legend>👤 Player (amount box)</legend><div class="row">${AB('+$','give_cash')}${AB('+LNC','give_coin')}${AB('Ban','ban','true')}${AB('Unban','ban','false')}${AB('Mute','mute','true')}${AB('Unmute','mute','false')}${AB('Reset save','wipe')}${AB('Clear 🚩','unflag')}</div></fieldset><fieldset><legend>♻️ My account</legend><div class="row"><button onclick="selfReset()">♻️ Reset my own save</button></div><small>Tap 🧑 Me to run any action above on yourself. Banning yourself is blocked.</small></fieldset><fieldset><legend>📈 Economy (amount box)</legend><div class="row">${AB('Set price','price')}${AB('Price ×amt','mult')}${AB('Freeze','freeze','true')}${AB('Unfreeze','freeze','false')}${AB('Set fee %','fee')}${AB('🌧️ $ to everyone','rain')}</div></fieldset><fieldset><legend>🌍 Real economy (server, amount box)</legend><div class="row"><button onclick="eadm('tariff')">Tariff ¢/kWh</button><button onclick="eadm('diff')">Difficulty ×amt/100</button><button onclick="eadm('diff_reset')">Reset difficulty</button><button onclick="eadm('rentx')">Rent ×amt/100</button><button onclick="eadm('tax')">Income tax %</button><button onclick="eadm('hw')">Hardware price ×amt/100</button><button onclick="eadm('reset')">Reset all</button></div><small>Run luni_mining_realism.sql first.</small></fieldset><fieldset><legend>📢 Broadcast</legend><div class="row"><input id="at" class="f" placeholder="text"></div><div class="row">${AB('Announce','broadcast')}${AB('Set MOTD','motd')}${AB('News headline','news')}</div></fieldset><fieldset><legend>🏢 Company</legend><div class="row"><input id="ac" class="f" placeholder="company name"></div><div class="row">${AB('+$ treasury','co_funds')}${AB('Disband','disband')}</div></fieldset><fieldset><legend>🚩 Players (tap to select) &amp; log</legend><div id="adl">Loading…</div></fieldset>`}});
<\/script>

<script>
/* Luni Mining 95 Ultimate: the game page is stored above (inert text) and opened in a same-origin frame.
   It reuses this site's Supabase client, so the site's GitHub login is the game login. */
(()=>{
 if(typeof APPS==='undefined'||typeof win!=='function'||typeof sb==='undefined')return;
 window.LUNI_BRIDGE={sb,login,isOwner:()=>isOwner(),me:()=>me};
 if(APPS.some(a=>a[0]==='mining'))return;
 const src=()=>document.getElementById('mining-src').textContent.replace(/<\\\/script/g,'</script').replace(/<\\!--/g,'<!--');
 APPS.push(['mining','Luni Mining 95 Ultimate','🪙',b=>{b.style.padding='0';b.style.overflow='hidden';
  b.append(h('iframe',{srcdoc:src(),allow:'fullscreen',title:'Luni Mining 95 Ultimate',style:'width:100%;height:100%;border:0;background:#008080'}))},800,620]);
 desk();
})();
</script>
