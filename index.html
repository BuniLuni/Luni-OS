const wins={};let z=10;
function front(w){z++;w.el.style.zIndex=z;w.el.classList.remove('hide')}
function win(id,title,icon,fn,wd=440,ht=400){
 if(wins[id])return front(wins[id]);
 const n=Object.keys(wins).length,body=h('div',{className:'body'}),el=h('div',{className:'w',style:`left:${50+n*26}px;top:${30+n*26}px;width:${wd}px;height:${ht}px`});
 const w={el,onclose:null};wins[id]=w;
 const task=h('button',{on:{click:()=>el.classList.contains('hide')||el.style.zIndex==z?el.classList.toggle('hide'):front(w)}},icon+' '+title);
 const x=()=>{w.onclose&&w.onclose();el.remove();task.remove();delete wins[id]};
 const tb=h('div',{className:'tb'},icon+' '+title,h('span',{},h('button',{on:{click:()=>el.classList.add('hide')}},'_'),h('button',{on:{click:x}},'x')));
 tb.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;front(w);el.classList.add('drag');const ox=e.clientX-el.offsetLeft,oy=e.clientY-el.offsetTop;
  const mv=m=>{el.style.left=Math.max(0,m.clientX-ox)+'px';el.style.top=Math.max(0,m.clientY-oy)+'px'};
  const up=()=>{el.classList.remove('drag');removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)};
 el.onpointerdown=()=>{z++;el.style.zIndex=z};
 el.append(tb,body);document.body.append(el);$('#tasks').append(task);front(w);
 Promise.resolve(fn(body,w)).catch(()=>body.append('Something broke.'));
}

const WC={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Heavy snow',80:'Showers',95:'Thunderstorm'};
function weather(b){
 const out=h('div'),inp=h('input',{placeholder:'City',value:store.get('city','')});
 const go=async()=>{const q=inp.value.trim();if(!q)return;out.textContent='Loading...';
  try{const g=(await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q))).json()).results?.[0];
   if(!g){out.textContent='City not found.';return}store.set('city',q);
   const d=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`)).json();
   out.replaceChildren(h('div',{className:'big'},Math.round(d.current.temperature_2m)+'°F'),h('div',{},`${g.name}, ${g.admin1||g.country}: ${WC[d.current.weather_code]||'Weather'}, wind ${d.current.wind_speed_10m} mph`),
    ...d.daily.time.map((t,i)=>h('div',{className:'row'},new Date(t+'T12:00').toLocaleDateString([],{weekday:'short'})+`  ${WC[d.daily.weather_code[i]]||''}  ${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°`)));
  }catch{out.textContent='Weather failed to load.'}};
 inp.onkeydown=e=>e.key==='Enter'&&go();b.append(h('div',{className:'bar'},inp,h('button',{on:{click:go}},'Go')),out);go();
}
const FEEDS=[['BBC World','https://feeds.bbci.co.uk/news/world/rss.xml'],['Hacker News','https://hnrss.org/frontpage'],['NASA','https://www.nasa.gov/feed/'],['Ars Technica','https://feeds.arstechnica.com/arstechnica/index']];

 const fill=()=>sel.replaceChildren(...[...FEEDS,...mine].map(f=>h('option',{value:f[1]},f[0])));

   out.replaceChildren(...(d.items||[]).slice(0,25).map(i=>h('div',{className:'row'},h('a',{href:i.link,target:'_blank',rel:'noopener noreferrer'},i.title))));
   if(!d.items?.length)out.textContent='No stories found.'}catch{out.textContent='Feed failed to load.'}};

 const add=()=>{try{const u=new URL(url.value.trim());mine.push([u.hostname,u.href]);store.set('feeds',mine);url.value='';fill();sel.value=u.href;load()}catch{toast('Enter a full feed URL')}};
 fill();b.append(h('div',{className:'bar'},sel),h('div',{className:'bar'},url,h('button',{on:{click:add}},'Add')),out);load();
}

   out.replaceChildren(...d.map(s=>h('div',{className:'row'},h('button',{on:{click:()=>{au.src=s.url_resolved;au.play().catch(()=>toast('Station would not play'));nowp=s.name;tray()}}},'Play'),' '+s.name)));

 const ch=sb.channel('chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>add(p.new)).on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>list.querySelector('#m'+p.old.id)?.remove()).subscribe();

 const top=['owner','admin'].includes(me.role),pane=h('div'),bar=h('div',{className:'bar'});

 const cnt=async(t,f)=>{let q=sb.from(t).select('*',{count:'exact',head:true});if(f)q=f(q);return (await q).count??0};
 const T={

function snake(b,w){

 const tick=()=>{const q=[(s[0][0]+d[0]+N)%N,(s[0][1]+d[1]+N)%N];if(s.some(p=>p[0]===q[0]&&p[1]===q[1]))return start();s.unshift(q);

 w.el.tabIndex=0;w.el.onkeydown=e=>{const k=K[e.key];if(k&&(k[0]+d[0]||k[1]+d[1])){d=k;e.preventDefault()}};

}
